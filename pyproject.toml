[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfff"
version = "0.1.0"
description = "Reactive/short-range fluctuation force field toolkit: GPU-native SOAP/ACE equivariant features and models."
requires-python = ">=3.10"
# torch-cluster is optional, and not listed here for two reasons. It ships only an sdist whose
# setup.py imports torch, and pip builds it in an isolated environment that has no torch, so
# listing it makes `pip install .` fail outright with "ModuleNotFoundError: No module named
# 'torch'" before anything else is installed. And rsfff.neighbors no longer needs it:
# radius_graph_torch produces the same graph in plain torch, at the same speed for molecular
# clusters (the neighbor list is a rounding error next to one model evaluation) and more slowly
# for a large periodic box, where the compiled cell list wins. Install it for that case -- see
# [neighbors] below.
dependencies = [
    "numpy",
    "pyyaml",
    "torch",
    "e3nn",
    "ase",
    "scipy",
]

[project.optional-dependencies]
# `pip install .[neighbors]` on its own hits the isolated-build failure, but
# `--no-build-isolation` does not: with isolation off the build sees the environment's own
# torch, so once torch is installed this is a single command --
#     pip install torch
#     FORCE_ONLY_CPU=1 pip install --no-build-isolation -e '.[neighbors]'
# (it needs setuptools and wheel present, since nothing provisions them for it).
# On a cluster with a site torch (NERSC), use that torch and keep pip away from it:
#     FORCE_ONLY_CPU=1 pip install --no-build-isolation torch-cluster
#     pip install --no-deps -e .
# It compiles, so run it on a login node -- compute nodes have no network -- and cap the
# parallelism with MAX_JOBS. FORCE_ONLY_CPU=1 skips the CUDA kernels, which is what a
# CPU-node loop wants and is much faster to build; for a GPU build name the arch instead:
# FORCE_CUDA=1 TORCH_CUDA_ARCH_LIST="8.0" (A100) with the CUDA toolkit loaded.
neighbors = [
    "torch-cluster",
]

# The force-field kernels (torchff port). The submodule at external/torchff-lib is the
# heindelj fork; it is not on PyPI, so it is installed from the checkout:
#     TORCHFF_NO_CUDA=1 pip install -e external/torchff-lib      # CPU: pure-torch reference paths
#     scripts/build_torchff_perlmutter.sh                         # GPU: compiles the CUDA kernels
# rsfff.ff.backend picks it up when importable (RSFFF_FF_BACKEND=auto|torch|torchff). It is
# not listed as a dependency: a relative path is not a valid requirement specifier, and the
# CPU/GPU install commands differ.

cue = [
    "cuequivariance>=0.10",
    "cuequivariance-torch>=0.10",
    "cuequivariance-ops-torch-cu12",
]
# Local (CPU) quantum-chemistry backend for rsfff.qcgen. On Colab the GPU stack
# (gpu4pyscf-cuda12x etc.) is installed from the notebook instead. Note: VV10
# (needed by wB97M-V) is built into pyscf; pyscf-dispersion is intentionally not
# pinned here (D3/D4 only, and its current release is broken against new numpy).
qc = [
    "pyscf>=2.14",
    "geometric",
    # Analytic CPHF polarizability for the CPU backend (rhf/rks/uhf/uks). The GPU
    # backend uses gpu4pyscf.properties instead.
    "pyscf-properties",
    # Parallel label stage (loky backend; safe to drive from a Jupyter kernel).
    "joblib>=1.3",
]

[project.scripts]
rsfff-train = "rsfff.train.train:main"
rsfff-train-eem = "rsfff.train.train_eem:main"
rsfff-train-monomer = "rsfff.train.train_monomer:main"

[tool.setuptools]
# src/ is imported as `rsfff`, which rules out automatic discovery: setuptools can find
# packages or rename a directory, not both. So this list is maintained by hand, and a
# subpackage missing from it is silently dropped from an installed (non-editable) rsfff --
# `pip install -e .` keeps working, `pip install .` gives an import error at runtime. Add
# every directory under src/ that has an __init__.py:
package-dir = { "rsfff" = "src" }
packages = [
    "rsfff",
    "rsfff.features",
    "rsfff.ff",
    "rsfff.ff.film",
    "rsfff.ff.v1",
    "rsfff.md",
    "rsfff.mlip",
    "rsfff.qcgen",
    "rsfff.train",
]
