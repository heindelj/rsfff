[job]
type        = "train.ionct"
description = "One ion CT / complete-model force field: rsfff.train.train_ionct on the folded ct-* sets under ionct.data (ct_sets/*.jsonl + walk_eda/*.xyz, relative to the project dir at the site), the parameter table ionct.params, the environment ionct.env, the preset's arguments plus ionct.args; then the pair-scan diagnostics. The run directory comes back as run.tar.gz."
tags        = ["train"]

[[inputs]]
name = "settings"
format = "json"
generated = true

[[outputs]]
name = "run"
format = "tar"
doc = "run.tar.gz: model.pt, metrics.json, predictions.csv, train.log, the pair-scan diagnostics"

[report]
"train.loss"         = "Float64"
"rsfff.ionct.test"   = { type = "Dict", doc = "test metrics (all / full / subset)" }
"rsfff.ionct.val"    = { type = "Dict", doc = "validation metrics" }
"rsfff.ionct.alpha"  = { type = "Dict", doc = "the last epoch's polarizability errors" }
"rsfff.ionct.n_feat" = "Int"
"rsfff.ionct.params" = "String"
"rsfff.ionct.env"    = "String"
"rsfff.wall_s"       = "Float64"

[settings]
text = """
struct IonCT terms "rsfff.ionct"
    env::String = "density" in {"soap", "density"}
    params::String = "train/nacl/ionct/params/ions_wb97mv_tzvpd_pf2p.json"   # relative to the project dir at the site
    preset::String = "complete" in {"complete", "v13", "none", "v13_freec", "v13_complete", "v13_complete_frozen", "v13_complete_mono", "v13_complete_pm", "v13_complete_shells", "v13_complete_sc", "v13_complete_force"}
    args::String = ""                                    # extra train_ionct arguments, appended to the preset's
    data::String = "train/nacl/ionct/data"               # ct_sets/ (+ walk_eda/), relative to the project dir
    analysis::String = "pairscan" in {"pairscan", "none"}
end
struct Settings terms "rsfff"
    epochs::Int = 600 in 1..100000 as "train.epochs"
    seed::Int = 0 in 0..1000000
    gpus::Int = 1 in 0..4 as "resources.gpus"
    ionct::IonCT
end
"""
