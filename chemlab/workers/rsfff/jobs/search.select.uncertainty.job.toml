[job]
type        = "search.select.uncertainty"
description = "A round's proposer: clusters of the round's sizes built from the system's monomers, committee MD on each (torch-sim), the most uncertain frames picked per size, an EDA share marked eda=1. The seed round (sizes = seed) instead optimises the monomer, draws Wigner samples (monomer=1) and random dimers."
tags        = ["propose"]

[[inputs]]
name = "candidate"
format = "tar"
optional = true
doc = "the committee of the round before (committee.tar.gz); none in the seed round"
[[inputs]]
name = "settings"
format = "json"
generated = true

[[outputs]]
name = "picks"
format = "extxyz"
doc = "the picks, one frame each: pick=, sigma_energy=, eda=1 / monomer=1 on the comment line"

[report]
"search.selected"         = "Int [1]"
"search.eda"              = "Int [unknown]"
"search.uncertainty.max"  = "Float64 [unknown]"
"search.uncertainty.mean" = "Float64 [unknown]"
"rsfff.sizes"             = "String"
"search.round" = "Int [1]"
"search.stage" = "Dict [unknown]"
"search.wall_s" = "Float64 [s]"
"rsfff.n_starts" = "Int [1]"
"rsfff.summary" = "Dict [unknown]"
"rsfff.wall_s" = "Float64 [s]"

[settings]
text = """
struct Seed terms "rsfff"
    n_wigner::Int = 100 in 1..10000              # Wigner samples of the optimised monomer
    wigner_temperature::Float64 = 300.0 in 1..3000 [K]
    n_dimers::Int = 500 in 0..100000
    n_dimer_eda::Int = 500 in 0..100000          # every n_dimers / n_dimer_eda-th dimer gets an EDA
    contact_min::Float64 = 1.5 in 0.5..10 [A]
    contact_max::Float64 = 4.0 in 0.5..20 [A]
end
struct Settings terms "rsfff"
    system::String = "water" in {"water", "hf", "nh3", "nacl"}
    sizes::String = "seed"                       # the round's cluster sizes ("3-9", "4,5,6,8"), or seed
    sampler::String = "torchsim" in {"torchsim", "ase"}
    n_per_size::Int = 2 in 1..100                # starting clusters per size
    time_ps::Float64 = 10.0 in 0.1..1000 [ps]
    dt_fs::Float64 = 1.0 in 0.1..5 [fs]
    every_fs::Float64 = 20.0 in 1..1000 [fs]
    temperature::Float64 = 300.0 in 1..3000 [K]
    replicas::Int = 1 in 1..64
    select_per_size::Int = 50 in 1..10000
    eda_fraction::Float64 = 0.1 in 0..1
    max_eda::Int = 25 in 0..10000
    max_fragments::Int = 20 in 1..200
    bias_mode::String = "none" in {"none", "sigma", "energy"}
    bias_weight::Float64 = 0.2 in 0..10
    max_batch::Int = 0 in 0..100000              # 0: the sampler's default
    minutes::Float64 = 0.0 in 0..1440            # 0: no time limit on the MD
    seed::Int = 0 as "search.seed"               # 0: from the sizes and the system
    gpus::Int = 4 in 1..4 as "resources.gpus"
    seed_round::Seed
end
"""
