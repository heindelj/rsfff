[job]
type        = "train.fit"
description = "Train the rsfff committee on the walk's dataset (train/train_committee.py through rsfff_al.assemble), warm-started from the committee before."
tags        = ["train"]

[[inputs]]
name = "dataset"
format = "jsonl"
doc = "the labelled structures so far: one JSON line per label job (xyz, job, the report)"
[[inputs]]
name = "candidate"
format = "tar"
optional = true
doc = "the committee of the round before, for the warm start (none: from scratch)"
[[inputs]]
name = "settings"
format = "json"
generated = true

[[outputs]]
name = "committee"
format = "tar"
doc = "committee.tar.gz: the trained members and committee.json"

[report]
"train.loss"       = "Float64 [unknown]"
"train.loss_val"   = { type = "Vector{Float64}", doc = "per member", unit = "unknown" }
"train.size"       = { type = "Dict", doc = "frames per set", unit = "unknown" }
"train.members"    = "Int [1]"
"train.warm_start" = "Bool"
"train.n_train" = "Int [1]"
"train.n_val" = "Int [1]"
"train.round" = "Int [1]"
"train.val" = "Dict [unknown]"
"train.wall_s" = "Float64 [s]"
"train.curves" = "Dict [unknown]"
"rsfff.files" = "Dict [unknown]"
"rsfff.wall_s" = "Float64 [s]"

[settings]
text = """
struct Settings terms "rsfff"
    model::String = "rsfff_committee" as "train.model"
    system::String = "water" in {"water", "hf", "nh3", "nacl"}
    config::String = "train/water_film_al.yaml"     # the fit config, relative to the project dir at the site
    members::Int = 4 in 1..16
    warm_start::String = "true" in {"true", "false"}
    warm_epochs::Int = 40 in 1..10000
    seed::Int = 0 in 0..1000000
    set::String = ""                                # extra --set KEY=VALUE pieces for train_committee.py, joined with ;
    gpus::Int = 4 in 1..4 as "resources.gpus"
end
"""
