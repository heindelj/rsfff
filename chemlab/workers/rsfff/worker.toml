# rsfff's worker (the rsfff package, chemlab.pkg.toml at the repository root): the GPU programs of the
# active-learning walks and the ion force fields, behind ChemLab's worker protocol. The programs are the
# project's own -- research/rsfff python/rsfff_al/worker.py (`python -m rsfff_al.worker gpu`): the committee
# sampler (search.select.uncertainty) and the film committee trainer (train.fit). The project says where it is at each site
# (research/rsfff workers/rsfff/context/<site>.toml: `project`, PYTHONPATH); the labels are the qchem
# package's jobs. Recreated 2026-10-23 (the old chemlab/workers was deleted) in the package layout.
[worker]
name = "rsfff"
description = "The rsfff walks and force fields: committee sampling, committee training, cmm (ion) model training, bonding-model training."
version = "0.2"

[resources]
cpus = "1..256"
gpus = "0..4"

[run."search.select.uncertainty"]
command = "bash {worker}/bin/gpu_worker.sh run {workdir}"
timeout_minutes = 1440
[run."train.fit"]
command = "bash {worker}/bin/gpu_worker.sh run {workdir}"
timeout_minutes = 1440
# The cmm (ion) models: this package's own program, rsfff.train.cmm_worker (bin/cmm_worker.sh), needing no project
# dir -- the data bundle comes as the job's input (scripts/cmm_bundle.py writes it).
[run."train.cmm"]
command = "bash {worker}/bin/cmm_worker.sh run {workdir}"
timeout_minutes = 2880
# The bonding (1-4) models (fff_bonding): this package's own program, rsfff.train.bonding_worker (bin/bonding_worker.sh),
# needing no project dir -- the config, the data and the references come as the job's inputs.
[run."train.bonding"]
command = "bash {worker}/bin/bonding_worker.sh run {workdir}"
timeout_minutes = 2880
