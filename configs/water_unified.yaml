# All four channels under the unified pair model, with learned range separation.
#
#   python -m rsfff.train.train_unified configs/water_unified.yaml
#
# One pair list (no fragment mask), one featurization, one response solve, one correction
# trunk, four targets: fragment_energy, eda_cls_elec, eda_mod_pauli, eda_disp.
#
# Two things differ from the per-term configs and both are load-bearing:
#
#   * The pair list keeps intramolecular pairs, so the classical forms are now evaluated on
#     covalent geometry and a range separation is *required* rather than optional -- including
#     for Pauli, which had none. See src/ff/range_priors.py for the measured O-H gap
#     (intra <= 1.072, inter >= 1.538 Angstrom) the r0 priors are placed in, and why alpha is
#     40 rather than the 8 the per-term modules use.
#
#   * Intramolecular pairs carry the classical backbone into `fragment_energy`. On water this
#     is nearly inert -- every intramolecular distance sits below its r0 -- with one deliberate
#     exception: H-H does not separate (intra reaches 1.729, inter starts at 1.611), so intra
#     H-H stays switched on and contributes ~55 kJ/mol per pair that the bond head and
#     E_internal no longer have to carry alone. That shifts the decomposition relative to
#     checkpoints/water_onebody_elec, so the response parameters will not transfer; refit.
#
# Watch `gate_intra_elst` / `gate_inter_elst`: those are the direct readout of whether the
# learned range separation reproduces what the hard mask used to do. gate_inter should sit at
# ~1.0; gate_intra is an average over element pairs and will NOT go to zero because of the
# H-H case above -- read it for a downward trend, not against zero.
run_name: water_unified
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd.xyz
  atomic_reference_states: data/atomic_reference_states.json
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]   # lambda=1 for chivec/Pauli dipoles, lambda=2 for alpha
  backend: e3nn
  density_channels: 8

unified:
  max_rank: 2                   # must match elec.max_rank
  # Range separation. Per element (see src/ff/range_priors.py), per channel, learnable.
  alpha_init: 40.0
  learn_r0: true
  environment_r0: false         # competes with the pair correction; leave off for the first fit
  learn_alpha: true
  # Fragment-state slot: identically zero for a neutral singlet, so inert on this data.
  # Present so H5O2+ is an addition rather than a retrofit. Set 0 to drop it entirely.
  fragment_state_dim: 4
  # Shared correction trunk
  emb_dim: 16
  corr_hidden: 64
  corr_depth: 2
  corr_n_radial: 8
  corr_r_on: 4.0
  corr_r_off: 5.0               # must not exceed features.cutoff
  elst_energy_scale: 3.0e-3
  pauli_energy_scale: 3.0e-3
  disp_energy_scale: 1.0e-3
  bond_energy_scale: 0.2        # Hartree; water's two O-H bonds are ~-0.37 Ha
  bond_r_on: 2.5
  bond_r_off: 4.0
  # Classical reach. The largest sets the one shared pair list.
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0
  # Loss. Each term is 1.0 at an error of one energy_scale, so these are dimensionless.
  # The interaction channels are weighted up for the same reason as configs/
  # water_onebody_elec.yaml: at init the fragment energy is off by ~960 kJ/mol against
  # cls_elec's ~14, so equal weights let the 1-body term own the first several epochs.
  energy_scale: 3.8093e-4
  onebody_weight: 1.0
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  anchor_weight: 1.0
  r0_weight: 0.05
  r0_spread_weight: 0.0

# Reused verbatim by the unified model: the response solve and the two parameter heads.
elec:
  max_rank: 2
  environment_chi: true
  environment_eta: true
  eta_floor: 0.05
  learn_dipole: true
  learn_quadrupole: true
  learn_z: true
  environment_z: false
  learn_b: true
  environment_b: false
  s_init: 0.5
  emb_dim: 16
  hidden: 64
  depth: 2
  equiv_channels: 32
  # Frozen-monomer multipoles on the anchor. These pin q/mu/Theta themselves; the fragment
  # energies then pin the response energy that produced them.
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2

dispersion:
  b_prior: per_element          # a uniform 2.0 over-binds badly; see build_log_priors
  learn_c6: true
  environment_c6: true
  learn_b: true
  environment_b: false
  emb_dim: 16
  hidden: 64
  depth: 2

pauli:
  learn_q: true
  environment_q: true
  learn_b: true
  environment_b: false
  learn_dipole: true
  learn_quadrupole: true
  emb_dim: 16
  hidden: 64
  depth: 2
  equiv_channels: 32

onebody:
  # The unified model reads only force_weight/force_scale/energy_scale from this block, for
  # the isolated-monomer anchor where the QC gradient really is -dE_1body/dR.
  energy_scale: 3.8093e-4
  force_weight: 1.0
  force_scale: 1.0e-3

train:
  epochs: 150
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 2
