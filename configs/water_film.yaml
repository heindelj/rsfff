# The state-conditioned, fragment-projected model of docs/fff_film.md, on nonreactive water.
#
#   python -m rsfff.train.train_film configs/water_film.yaml
#
# Writes to checkpoints/water_film*/. The v4 expert model and its configs are untouched.
#
# What changed relative to configs/water_expert.yaml, in one place:
#
#   * the NN bond-energy head is gone. The one-body PES is a Morse bond + cosine angle whose
#     parameters (r_eq, D, k; theta_eq, k_theta) are generated by a FiLM-conditioned network
#     and start exactly at the fitted pyCMM water values. `bond_var` and the std_* diagnostics
#     watch the geometry-independence of those parameters -- the interpretability dial.
#   * permanent multipoles are direct heads on the fragment-internal features ONLY; there is
#     no frozen SQE solve. The polarization response (SQE + induced dipoles) runs once, at the
#     coupled level, *around* the permanent multipoles -- the drive vanishes there by
#     construction, so an isolated fragment's induction is exactly zero.
#   * the environment enters through zero-initialized embedders of the environment and cross
#     feature blocks; env_* metrics read |theta - theta_0| per quantity as before.
#
# What to watch, in order of what will bite:
#
#   bond_var    the bonded parameters' feature-dependent deviation from their per-type tables.
#   std_*       rising means the Morse "parameters" are becoming a disguised pair energy.
#   env_*       per-quantity theta - theta_0 movement; same reading as v4.
#   q_res       the exact charge projection's residual; >1e-12 is a bug, not a fit problem.
#   ob_mae      one-body error on the cluster batch (not optimized there; frag_mae is).
#   cg_ind      CG iterations; a climbing count is the early warning. cg_fail must stay 0.

run_name: water_film
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd_pol.xyz
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]
  backend: e3nn
  density_channels: 8

film:
  # --- conditioning. "film" is the design; "none"/"concatenate" are the §10 ablations. ------
  conditioning_mode: film
  cross_lambdas: [0]
  block_dim: 64
  hidden: 128
  depth: 2
  film_hidden: 32
  film_depth: 1
  gate_a0: 0.5
  max_rank: 2

  # Identically zero for a neutral singlet, so inert on this data -- present so the state key
  # is an addition rather than a retrofit when charged fragments arrive (fff_film.md §8.3).
  fragment_state_dim: 4

  # --- family heads --------------------------------------------------------------------------
  emb_dim: 16
  head_hidden: 64
  head_depth: 2
  equiv_channels: 32
  bonded_hidden: 64
  bonded_depth: 1
  eta_init: 0.5
  eta_floor: 0.05
  s_init: 0.5
  disp_b_prior: per_element

  # --- classical reach and range separation ---------------------------------------------------
  alpha_init: 40.0
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0

  induction: true
  cg_rtol: 1.0e-9
  cg_atol: 1.0e-12
  cg_maxiter: 100

  # --- loss ------------------------------------------------------------------------------------
  energy_scale: 3.8093e-4
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  induction_weight: 30.0
  total_energy_weight: 0.0
  force_weight: 1.0
  force_scale: 1.0e-3
  force_every: 2

  fragment_weight: 10.0
  fragment_batch_size: 64
  anchor_weight: 10.0
  anchor_batch_size: 32
  anchor_force_every: 5

  # 0 for the first fit: measure the unopposed environment dependence before dialing it.
  env_penalty_weight: 0.0
  # The geometry-independence regularizer. Nonzero from the start, deliberately -- unlike the
  # env penalty there is no "unopposed measurement" to take first: without it the parameter
  # functions can absorb arbitrary PES error from step one and the Morse form means nothing.
  bonded_variance_weight: 1.0e-2
  r0_weight: 0.05
  r0_spread_weight: 1.0

# Reused blocks: multipole/polarizability label weights and the monomer anchor's force term.
elec:
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2
  polarizability_weight: 1.0
  polarizability_scale: 0.5

onebody:
  energy_scale: 3.8093e-4
  force_weight: 1.0
  force_scale: 1.0e-3

train:
  epochs: 80
  init_from: ""
  lr_schedule: cosine
  lr_final_factor: 0.02
  batch_size: 128
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 5

# Stage A (isolated water) then the full fit -- fff_film.md §8.2. Dimers/clusters arrive with
# the full stage; holding out complete cluster sizes is a data.path override away.
stages:
  - name: isolated
    train:
      epochs: 15
      lr_schedule: none
    film:
      induction: false
      force_weight: 0.0
      fragment_weight: 30.0

  - name: full
    train:
      epochs: 80
    film:
      induction: true
