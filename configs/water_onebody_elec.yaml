# The 1-body term and classical electrostatics, fit jointly on one shared response solve.
#
#   python -m rsfff.train.train_onebody_elec configs/water_onebody_elec.yaml
#
# E_1body(f) = sum_i E0[Z_i] + E_internal(f) + sum_{i<j in f} W(r) dE_ij      per fragment
# E_elec     = sum over inter-fragment pairs of point multipoles + penetration + correction
#
# ONE FragmentResponse produces both: the multipoles that interact, and the internal energy
# that paid for arranging them. That is the point of fitting them together. Separately, each
# target leaves the response under-determined in a different direction --
#
#   * cls_elec sees the multipoles only through their pairwise interaction, and at
#     max_rank 2 the charges collapse toward zero while the energy MAE keeps improving;
#   * the fragment multipole targets fix q, mu, Theta but not the response *energy*
#     ((C, chiquad) -> (lambda C, chiquad/lambda) leaves Theta invariant);
#   * the fragment energies are the only target that sees E_internal.
#
# -- so fitting in sequence means the second stage undoes part of the first.
#
# Both halves stay exact: descriptors and the solve are grouped by fragment, so the 1-body
# energy is exactly one-body and the electrostatics exactly two-body. Watch `q_res`: the
# per-fragment charge residual must stay at machine zero.
#
# Measured on w2 at max_rank 2, 24 epochs at these weights (see src/train/train_onebody_elec.py
# for the full table): el_mae 13.86 -> 0.98 kJ/mol, dip_mae 0.451 -> 0.053 e*a0,
# quad_mae 1.62 -> 0.294 e*a0^2, f_mae 0.060 -> 0.0014 Ha/A, and -- the point of the joint
# fit -- qO holds at -0.43 with dchi +0.32 where electrostatics alone at rank 2 collapses to
# qO -0.06 with dchi inverted. Two things still want tuning: quad_mae was still falling at
# epoch 24, and ob_mae is not monotone (3.58 at epoch 12, 8.39 at 24) while everything else
# improves -- try a lower learning rate there first.
run_name: water_onebody_elec
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  # Cluster frames: fragment energies (~34k monomer labels) and eda_cls_elec.
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  # Must match the fragment energies' level of theory (wB97M-V/def2-TZVPD). These are pyscf
  # numbers, not Q-Chem's, so a per-atom constant remains; for water-only data n_H = 2 n_O
  # makes only E0_O + 2 E0_H identifiable anyway. qchem_roundtrip/atoms/ holds the inputs
  # for exact replacements.
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  # Isolated monomers: energy, forces, and the frozen-monomer multipoles. An anchor rather
  # than another entry in `path` because they carry no eda_* components and do carry
  # forces, so concatenating would be refused -- and because this is the only set where the
  # reference gradient IS -dE_1body/dR.
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd.xyz
  # Seeds per-element chi/eta from the isolated-atom IP/EA (the free-atom limits of the SQE
  # parameters). Without it chi is uniform and the solved charges start identically zero.
  atomic_reference_states: data/atomic_reference_states.json
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]  # lambda=1 for chivec, lambda=2 for alpha and chiquad
  backend: e3nn
  density_channels: 8

joint:
  # Both energy terms are already 1.0 at one energy_scale of error, so these are
  # dimensionless. They are unequal because the targets are: at init the fragment energy is
  # off by ~960 kJ/mol (the bond head starts at zero) against cls_elec's ~14, so equal
  # weights would let the 1-body term own the first several epochs.
  onebody_weight: 1.0
  elec_weight: 30.0
  anchor_weight: 1.0

onebody:
  emb_dim: 16
  bond_hidden: 64
  bond_depth: 2
  bond_n_radial: 8
  bond_r_on: 2.5               # well past the 1.5 A intramolecular H-H
  bond_r_off: 4.0              # must not exceed features.cutoff
  bond_energy_scale: 0.2       # Hartree; water's two O-H bonds are ~-0.37 Ha
  energy_scale: 3.8093e-4      # 1 kJ/mol per fragment
  force_weight: 1.0            # monomer anchor only
  force_scale: 1.0e-3          # Hartree/Angstrom

elec:
  target: cls_elec
  cutoff: 12.0                 # this is the one term with a genuine 1/r tail
  taper_width: 1.0
  max_rank: 2                  # charges + dipoles + quadrupoles, all from the solve
  r0_init: 1.5
  alpha: 8.0
  learn_r0: true
  r0_weight: 0.05
  environment_chi: true
  environment_eta: true
  eta_floor: 0.05
  learn_dipole: true
  learn_quadrupole: true
  learn_z: true
  environment_z: false
  learn_b: true
  environment_b: false
  s_init: 0.5
  emb_dim: 16
  hidden: 64
  depth: 2
  equiv_channels: 32
  correction: true
  corr_hidden: 64
  corr_depth: 2
  corr_r_on: 4.0
  corr_r_off: 5.0              # must not exceed features.cutoff
  corr_energy_scale: 3.0e-3
  corr_l2_weight: 0.0
  intra_fragment_features: true
  allow_environment: false
  # Frozen-monomer multipoles, on the anchor. These pin q/mu/Theta themselves; the fragment
  # energies then pin the response energy that produced them.
  dipole_weight: 1.0
  dipole_scale: 0.05           # e*a0 (~0.13 D); monomer dipoles run ~0.75
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2        # e*a0^2

train:
  epochs: 150
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 2
