# The 1-body term: frozen atomic references + an intramolecular bond energy.
#
#   python -m rsfff.train.train_onebody configs/water_onebody.yaml
#
# E_1body(f) = sum_{i in f} E0[Z_i] + sum_{i<j in f} W(r_ij) dE_ij
#
# This term is EXACTLY ONE-BODY: the descriptor is grouped by fragment and the pair list is
# intra-fragment, so every E^(k>=2) of the many-body expansion is zero to round-off (checked
# in tests/test_ff_onebody.py). E0 is position-independent, so the pair sum -- the bond
# energy, physically the spin-pairing energy -- carries all of the force.
#
# The target is per FRAGMENT, not per frame: `fragment_energies` from the EDA outputs gives
# one isolated-monomer energy per water, so the ~9.6k cluster frames supply ~34k labels at
# exactly the geometries monomers take inside clusters. The 500 standalone h2o frames add
# the force signal, where the QC gradient *is* -dE_1body/dR.
#
# Two calibrations that differ deliberately from every other term's pair head: a covalent
# bond is ~0.2 Ha (not 1e-3) and lives at 0.96-1.7 A (not 4-5), so bond_energy_scale and the
# envelope window are set for bonds. See src/ff/onebody.py.
run_name: water_onebody
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  # Cluster fragment energies: ~34k monomer labels at in-cluster geometries.
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  # Must match the level of theory of the fragment energies (wB97M-V/def2-TZVPD). These
  # come from pyscf, not Q-Chem, so a small per-atom constant remains; for water-only data
  # that is entirely absorbed by the bond head, since n_H = 2 n_O makes only E0_O + 2 E0_H
  # identifiable. qchem_roundtrip/atoms/ holds the inputs for exact replacements.
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  # The isolated monomers ride as an anchor rather than in `path`: they carry no eda_*
  # components and they do carry forces, so concatenating would be refused. This is
  # also the only set where the reference gradient IS -dE_1body/dR.
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd.xyz
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 2]     # the bond head reads invariants; the featurizer needs 2
  backend: e3nn
  density_channels: 8

onebody:
  emb_dim: 16
  bond_hidden: 64
  bond_depth: 2
  bond_n_radial: 8
  bond_r_on: 2.5               # well past the 1.5 A intramolecular H-H
  bond_r_off: 4.0              # must not exceed features.cutoff
  bond_energy_scale: 0.2       # Hartree; water's two O-H bonds are ~-0.37 Ha
  energy_scale: 3.8093e-4      # 1 kJ/mol; the fit term is 1.0 at that per-fragment error
  # Applies to the monomer anchor only -- on a cluster frame the QC gradient is the sum
  # over every force-field term and says nothing about this one on its own.
  force_weight: 1.0
  force_scale: 1.0e-3          # Hartree/Angstrom
  intra_fragment_features: true

train:
  epochs: 60
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 2
