# The whole decomposition, fitted in three stages from one command.
#
#   python -m rsfff.train.train_unified configs/water_staged.yaml
#
# Each stage warm starts from the previous stage's *best* checkpoint and writes to its own
# directory (checkpoints/water_staged_frozen, _pol, _ct), so a stage can never overwrite what
# it started from and any stage can be resumed or re-run on its own.
#
# Why staged rather than all at once: each higher level's label is a **difference** against the
# level below it -- `pol` is E_pol - E_frozen and `ct` is E_ct - E_pol. Turning them all on
# together makes a regression in a lower channel and a bad fit in a new one indistinguishable.
#
# Stage 1 (frozen_pol)  fragment_energy, cls_elec, mod_pauli, disp **and** eda_pol, together.
#                   The response parameters read the environment-aware descriptor, the
#                   inter-fragment electrostatics sits *inside* the response functional so the
#                   multipoles relax against each other, and the one-body level is still free.
#
#                   These were two stages and are now one. The split of `fragment_energy`
#                   between `E_internal` and `E_atom` is unlabeled -- only the sum is fitted --
#                   so it is a flat direction the optimizer diffuses along rather than
#                   converging: measured over the old 40-epoch frozen stage, sd ~6 kJ/mol on
#                   each half at correlation -0.98, a labeled sum stable to 1.15, and a 32x
#                   spread on validation `ob_mae`. `pol` is the only label that says how the
#                   multipoles *move*, so fitting it while the one-body level is still free
#                   constrains `E_internal` from a direction `fragment_energy` cannot. See the
#                   stage block below for what this does and does not fix.
#
# Stage 2 (ct)      + eda_ct. Inter-fragment charge-flow channels open; charge conserves per
#                   frame while each fragment's charge is free to move. Still its own stage:
#                   it changes what a fragment is, and its label is a difference against `pol`.
#
# Cost, measured on w2 (2158 train frames): 14.4 / 19.5 / 24.2 s per epoch. The coupled solve
# costs +35% and both levels +68% -- much less than the 2-4x a dense solve would have.
#
# What to watch, in order of what will bite:
#
#   cg_pol, cg_ct   CG iterations, 5-8 on a fresh model. A climbing count is the early warning
#                   that the coupled functional is losing positive definiteness -- for a
#                   polarization model, that it is running away -- well before a NaN.
#   cg_fail         frames that did not converge or hit negative curvature. Must stay 0.
#   pol_ff          the classical relaxation. Negative by the variational principle while the
#                   two levels share response parameters; `env_weight` is the lever if it turns.
#   pol_ff/ct_ff    vs pol_mae/ct_mae: pol and ct are both "environment-dependent correction"
#   against the     and are separated only by their labels and by acting on disjoint pair sets.
#   MAEs            Same degeneracy shape as the intra-classical/bond leak, which the fit did
#                   NOT police on its own. Watch the split, not the MAE.
#   q_ct            charge actually crossing a fragment boundary (e). Zero means the compliance
#                   head closed every channel and `ct` is carried entirely by its correction.
#   env_norm        how much environment the model asks for. Anchoring makes g's gradient a
#                   difference between streams, so it wakes slowly -- but it must wake. In the
#                   previous run it went to *identically* zero and stayed there, which was not
#                   the model declining the environment but weight decay deleting a block that
#                   gets no gradient at initialization (rsfff.mlip.heads.zero_init_readout).
#                   Four other blocks went the same way. If env_norm reads exactly 0.0 rather
#                   than merely small, that is the failure, not a preference.
#   alpha_mae       monomer polarizability error, max tensor component in e^2*Ang^2/Ha
#                   (1 a0^3 = 0.28). Starts ~2.1; the previous model sat at an isotropic
#                   3.87 a0^3 against a true 9.89, so this has real ground to make up.
#

run_name: water_staged
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  # The monomer anchor, with the def2-TZVPD molecular polarizability tensors folded in by
  # scripts/parse_polarizability.py (499 of 500 frames; one Q-Chem job did not finish).
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd_pol.xyz
  # wB97M-V/def2-TZVPD, matching the labels. The older file this replaced said b3lyp/def2-svpd
  # in its own header while every label here is wB97M-V/def2-TZVPD -- and these states are not
  # decoration: they seed the per-element chi_0/eta_0 of the SQE solve and, from
  # `free_alpha_weight` on, they pin the free-atom polarizability exactly.
  # See scripts/atomic_reference_states_wb97mv.py.
  atomic_reference_states: data/atomic_reference_states_wb97mv_tzvpd.json
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]   # lambda=1 for chivec/Pauli dipoles, lambda=2 for alpha
  backend: e3nn
  density_channels: 8

unified:
  max_rank: 2                   # must match elec.max_rank
  # Range separation. Per element (see src/ff/range_priors.py), per channel, learnable.
  alpha_init: 40.0
  learn_r0: true
  environment_r0: false         # competes with the pair correction; leave off for the first fit
  # Per-element r0 only. The per-pair deviation is read from the pair trunk, which is switched
  # off below -- and it was implicated in the dispersion leak that put -39 kJ/mol per fragment
  # of "intramolecular dispersion" between bonded atoms, because the shared trunk applied one
  # deviation to intra and inter pairs alike.
  pair_range_separation: false
  learn_alpha: true
  # Fragment-state slot: identically zero for a neutral singlet, so inert on this data.
  # Present so H5O2+ is an addition rather than a retrofit. Set 0 to drop it entirely.
  fragment_state_dim: 4
  # Environment-aware descriptor for the INTERACTION parameters: h_env = h_frag + g(h_full),
  # g zero-initialized so this starts from exactly the fragment-confined model and env_norm
  # measures how much environment the fit actually asks for. This is what lets C6 be quenched
  # by the surroundings -- effective many-body dispersion.
  #
  # Intra-fragment pairs and the response solve stay on h_frag regardless: `fragment_energy`
  # is an isolated-fragment label with no environment dependence to fit, so a 1-body term
  # built on h_env would be fitting a function that cannot match its target. The cost is a
  # second power spectrum per forward (one shared neighbor search) and the interaction
  # channels ceasing to be rigorously two-body -- which is the intended trade, not a
  # regression.
  environment_features: true
  env_hidden: 64
  env_depth: 2
  env_weight: 0.0
  # Shared correction trunk
  emb_dim: 16
  corr_hidden: 32
  corr_depth: 2
  corr_n_radial: 8
  corr_r_on: 4.0
  corr_r_off: 5.0               # must not exceed features.cutoff
  elst_energy_scale: 3.0e-3
  pauli_energy_scale: 3.0e-3
  disp_energy_scale: 1.0e-3
  bond_energy_scale: 0.2        # Hartree; water's two O-H bonds are ~-0.37 Ha
  bond_r_on: 2.5
  bond_r_off: 4.0
  # --- the atomic energy replaces the pair corrections ---------------------------------
  # The bond readout was carrying three jobs: the covalent bond energy, the unlabeled
  # one-body gauge inside `fragment_energy`, and (through the bond_pol/bond_ct telescoping)
  # `eda_pol` and `eda_ct`. Two of the three had no label, and the measured result was a
  # constant -1.686 kJ/mol per fragment in `fragment_energy` -- identical to three decimals
  # across w2..w5, so the frame-pooled plots drew it as a size-dependent offset -- alongside a
  # `ct` channel that was 96.7% neural.
  #
  # `atomic_energy` takes over the first job properly: one network, read at three electronic
  # states, so what separates the levels is the state and not a parameter. The pair head stays
  # built and loadable, its other readouts are simply not consumed.
  #
  # Per channel, so the two cases can be told apart. `bond` and `ct_bond` are the ones the
  # paragraph above is about: they sit where nothing labels them, degenerate with
  # `atomic_energy` and with `ct` respectively, and they stay off. `elst` is not in that
  # position -- it corrects a channel that has its own label (`eda_cls_elec`) and is the only
  # correction whose `h_env - h_frag` difference is routed to `pol`, so it corrects
  # polarization too. `pauli` and `disp` stay off for now: their channels are the two whose
  # classical forms already leaked into the bonded region once, and adding a neural readout
  # there before that is settled would re-open it with no label to catch it.
  #
  # Cost: turning `elst` on makes the electrostatic split live, which scores the inter pairs a
  # second time on `h_frag` (the frozen re-score whose difference becomes `pol`). Measured
  # per epoch: +15% at the frozen stage, +9% at ct.
  pair_corrections: []
  atomic_energy: true
  atomic_energy_hidden: 32
  atomic_energy_depth: 2
  atomic_energy_equiv_channels: 32
  atomic_energy_scale: 0.2      # sized against a covalent bond, like bond_energy_scale
  # Classical reach. The largest sets the one shared pair list.
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0
  # Loss. Each term is 1.0 at an error of one energy_scale, so these are dimensionless.
  # The interaction channels are weighted up for the same reason as configs/
  # water_onebody_elec.yaml: at init the fragment energy is off by ~960 kJ/mol against
  # cls_elec's ~14, so equal weights let the 1-body term own the first several epochs.
  energy_scale: 3.8093e-4
  onebody_weight: 1.0
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  anchor_weight: 1.0
  # The monomer anchor is a fixed cost per *optimizer step*, independent of the cluster batch
  # size, and profiling put it at 58% of a step at batch 32. Two levers, both here: draw fewer
  # monomer frames, and apply the force term -- the fit's only second-order backward, 36% of a
  # step on its own -- every fifth step. See `train.batch_size` for the third.
  anchor_batch_size: 32        # the anchor force term is a 2nd-order backward; see UnifiedConfig
  anchor_force_every: 5
  # The exact free-atom limit of the on-site polarizability, from
  # data/atomic_reference_states_wb97mv_tzvpd.json (H 5.05, O 5.53 a0^3). A lone atom has an
  # all-zero density, so alpha_i collapses to one isotropic number per element and this pins
  # it rather than nudging it. It is what the Phase-1 monomer fit had and this one dropped --
  # and it matters because alpha_flow, built from B^T R, has no component perpendicular to a
  # planar molecule, so the on-site sector carries all of water's out-of-plane response alone.
  free_alpha_weight: 1.0
  # A one-sided barrier holding r0_pair at or below its element prior, not the unbounded
  # downward pull this used to be. That pull is what put -39 kJ/mol per fragment of
  # "intramolecular dispersion" between bonded atoms in the last run: it drove the *shared
  # trunk's* per-pair deviation to -0.42 on intra and inter O-H alike, so restricting the
  # penalty to inter pairs protected nothing. See AnchorTerms.penalties.
  r0_weight: 0.05
  intra_classical_weight: 0.05  # keep the classical forms out of the bond channel's region
  # Holds each per-atom r0 near its element prior, in log space. Nonzero now because the
  # barrier above is one-sided and so does not oppose a downward drift of the per-element
  # base: in the last run r0(H) and r0(O) on the dispersion channel effectively swapped
  # (1.75 -> 0.87, 0.89 -> 1.70) with nothing pushing back. Watch r0_elst/r0_pauli/r0_disp.
  r0_spread_weight: 1.0
  # Level settings shared by every stage; the stages below flip the two switches.
  ct_channel_cutoff: 5.0
  ct_channel_taper: 1.0
  ct_compliance_scale: 0.1
  cg_rtol: 1.0e-9
  cg_atol: 1.0e-12
  cg_maxiter: 100

# Reused verbatim by the unified model: the response solve and the two parameter heads.
elec:
  max_rank: 2
  environment_chi: true
  environment_eta: true
  eta_floor: 0.05
  learn_dipole: true
  learn_quadrupole: true
  # Axially anisotropic quadrupole polarizability: three positive eigenvalues
  # (m = 0, |m| = 1, |m| = 2) about a learned axis, instead of one isotropic scalar.
  # Initialized with the three equal, so stage 1 is unaffected -- and at zero field
  # gradient it is genuinely redundant (every Theta is reachable either way). It
  # starts doing work at stage 2, where Theta = C (gradF - chiquad) makes the
  # response directional.
  anisotropic_cquad: true
  # Output the permanent multipoles directly; alpha/cquad describe only the response to a
  # field. Same functional as the chivec form (mu0 = -alpha chivec) so the solve is unchanged,
  # but the permanent multipole stops being a product of two heads -- which is the entanglement
  # that let the polarizability be dismantled (9.904 -> 8.903 a0^3) while the dipole labels
  # looked fine -- and alpha -> 0 no longer forces a non-polar atom.
  #
  # It empties the on-site sectors out of `internal`: with the frozen state *at* the minimum
  # there is no -1/2 chi^T a chi to report, so the ~-400 kJ/mol per fragment it carried moves
  # into `atomic_energy`. Watch `d_internal` AND `d_e_atom` from here on; the first is near
  # zero by construction now and would never fire on its own.
  direct_multipoles: true
  learn_z: true
  environment_z: false
  learn_b: true
  environment_b: false
  s_init: 0.5
  emb_dim: 8
  hidden: 32
  depth: 2
  equiv_channels: 32
  # Frozen-monomer multipoles on the anchor. These pin q/mu/Theta themselves; the fragment
  # energies then pin the response energy that produced them.
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2
  polarizability_weight: 1.0
  polarizability_scale: 0.5

dispersion:
  b_prior: per_element
  learn_c6: true
  environment_c6: true
  learn_b: true
  environment_b: false
  emb_dim: 8
  hidden: 16
  depth: 2

pauli:
  learn_q: true
  environment_q: true
  learn_b: true
  environment_b: false
  learn_dipole: true
  learn_quadrupole: true
  emb_dim: 8
  hidden: 16
  depth: 2
  equiv_channels: 16

onebody:
  # The unified model reads only force_weight/force_scale/energy_scale from this block, for
  # the isolated-monomer anchor where the QC gradient really is -dE_1body/dR.
  energy_scale: 3.8093e-4
  force_weight: 1.0
  force_scale: 1.0e-3

train:
  epochs: 150          # overridden per stage below
  # 32 was a poor operating point once the anchor is priced in. The anchor, the free-atom
  # limit and the optimizer step are all *per step* and independent of how many cluster frames
  # the step covers, so a small batch pays them over and over: measured per epoch at the frozen
  # stage, 62.0 s at batch 32 against 25.4 s at 128 and 18.5 s at 256, on identical work.
  #
  # This is not free -- it is 4x fewer optimizer updates per epoch, so it changes the
  # optimization and not only the wall clock. 128 is the compromise: most of the speedup, and
  # still 68 updates an epoch. Raise `learning_rate` if the fit turns out to be update-starved
  # rather than time-starved.
  batch_size: 128
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 2

# Three stages, run in order from one command. Each inherits everything above and overrides
# only what changes; an unknown field here raises immediately rather than being ignored.
stages:
  # The frozen level and polarization are decided **together**, in one stage.
  #
  # They used to be two, and the reason to merge them is what the split of `fragment_energy`
  # between `E_internal` and `E_atom` does when only their sum is labeled. It is a flat
  # direction, so at a fixed learning rate the optimizer diffuses along it rather than
  # converging: measured over the old 40-epoch frozen stage the two halves each wandered with
  # sd ~6 kJ/mol at correlation -0.98 while their labeled sum held to 1.15, and the
  # per-fragment residual of that walk put a 32x spread on validation `ob_mae` (0.67 to 21.8).
  # Best-checkpoint selection then handed `pol` whichever sample scored best and the freeze
  # pinned it there, so the whole rest of the fit inherited one draw from a distribution.
  #
  # `pol` is a second label on the response parameters -- the only one that says how the
  # multipoles *move* rather than where they sit -- so fitting it while the one-body level is
  # still free constrains `E_internal` from a direction `fragment_energy` cannot.
  #
  # **It does not make the gauge non-flat, and it is worth being precise about why.** A
  # constant shift `E_internal += d`, `E_atom -= d` is invisible to `pol` by construction:
  # the atomic half enters as `E_atom^pol - E_atom^0`, one network read at two states, where
  # an additive constant cancels exactly; and the response half enters as
  # `level_pol.energy - E_internal`, where both terms move together. What `pol` constrains is
  # the *fragment-dependent* part of the slosh, which is the part that shows up in `ob_mae` --
  # the mean of the labeled sum was already stable. `lr_schedule` below handles the rest.
  #
  # Two consequences of merging, both good: the correction trunk is built at its full width
  # from epoch 1, so the `pair_head.trunk.0.weight` zero-pad at the old 1->2 boundary is gone;
  # and there is one fewer best-checkpoint selection in the chain.
  - name: frozen_pol
    train:
      epochs: 60
      # See TrainConfig.lr_schedule. This is the half of the gauge problem that co-training
      # cannot reach: it shrinks the step size that sets the diffusion amplitude, so the stage
      # ends at a converged point instead of at a sample. Watch the spread of `internal` and
      # `e_atom` over the last few epochs -- that is the number this is meant to move.
      lr_schedule: cosine
      lr_final_factor: 0.02
    unified:
      polarization: true
      charge_transfer: false
      pol_weight: 30.0
      # Both levels are being decided here, so the one-body label is live and there is
      # nothing yet to freeze or to anchor drift against.
      onebody_weight: 1.0
      freeze_frozen_level: false
      internal_drift_weight: 0.0
      # Raised from the old frozen stage's 1.0. With `pol` on at weight 30 and the frozen
      # level *not* frozen, the monomer anchor is the only thing pinning what an isolated
      # water is, and at 32 anchor frames a step against ~8600 cluster frames it was being
      # outvoted -- which is why the old `pol` stage raised it to 10 the moment `pol` came on.
      # The freeze used to be the real protection here and there is no freeze at this stage.
      anchor_weight: 10.0

  # `ct` stays its own stage, because unlike `pol` it is not merely a second view of the same
  # parameters: it opens inter-fragment charge-flow channels, which is a change to what a
  # fragment *is*. Its label is a difference against `pol`, so `pol` has to be settled first.
  - name: ct
    train:
      epochs: 30
      lr_schedule: cosine
      lr_final_factor: 0.02
    unified:
      polarization: true
      charge_transfer: true
      pol_weight: 30.0
      ct_weight: 30.0
      # The frozen level and polarization are both settled by the stage above and are held
      # there. `h_env == h_frag` exactly on an isolated fragment, so `ct` can say everything
      # it needs through `g`, the coupled solve and the correction trunk without touching what
      # a monomer is. Left free it did not: internal energy moved 109 kJ/mol at this stage.
      onebody_weight: 0.0
      freeze_frozen_level: true
      # Reads an exact zero while the freeze is on -- it is there to *say* so. A nonzero
      # d_internal means a route into the frozen level was missed, which is worth catching
      # for free on a forward that happens anyway.
      internal_drift_weight: 1.0
      anchor_weight: 10.0

      total_energy_weight: 10.0
      force_weight: 0.0
      force_scale: 1.0e-3         # Ha/Angstrom
