# The whole decomposition, fitted in three stages from one command.
#
#   python -m rsfff.train.train_unified configs/water_staged.yaml
#
# Each stage warm starts from the previous stage's *best* checkpoint and writes to its own
# directory (checkpoints/water_staged_frozen, _pol, _ct), so a stage can never overwrite what
# it started from and any stage can be resumed or re-run on its own.
#
# Why staged rather than all at once: each higher level's label is a **difference** against the
# level below it -- `pol` is E_pol - E_frozen and `ct` is E_ct - E_pol. Turning them all on
# together makes a regression in a lower channel and a bad fit in a new one indistinguishable.
#
# Stage 1 (frozen)  fragment_energy, cls_elec, mod_pauli, disp. This is configs/water_unified
#                   exactly, and it must be refit rather than loaded from the old checkpoint:
#                   `EnvironmentResidual` is now anchored as h_env = h_frag + g(h_full) -
#                   g(h_frag), which is what makes pol/ct exactly zero on an isolated fragment
#                   but also redefines h_env. Measured on the pre-anchoring checkpoint, the
#                   1-body half transfers exactly (ob_mae 0.1531, dip_mae 0.01146) while the
#                   interaction half does not (elst_mae 0.4615 -> 77.56).
#
# Stage 2 (pol)     + eda_pol. The response parameters start reading the environment-aware
#                   descriptor, the inter-fragment electrostatics moves *inside* the response
#                   functional so the multipoles relax against each other, and the bond channel
#                   gains the external field as a feature. The correction trunk widens by 9
#                   here; warm start zero-pads it, so the new input starts inert.
#
# Stage 3 (ct)      + eda_ct. Inter-fragment charge-flow channels open; charge conserves per
#                   frame while each fragment's charge is free to move.
#
# Cost, measured on w2 (2158 train frames): 14.4 / 19.5 / 24.2 s per epoch. The coupled solve
# costs +35% and both levels +68% -- much less than the 2-4x a dense solve would have.
#
# What to watch, in order of what will bite:
#
#   cg_pol, cg_ct   CG iterations, 5-8 on a fresh model. A climbing count is the early warning
#                   that the coupled functional is losing positive definiteness -- for a
#                   polarization model, that it is running away -- well before a NaN.
#   cg_fail         frames that did not converge or hit negative curvature. Must stay 0.
#   pol_ff          the classical relaxation. Negative by the variational principle while the
#                   two levels share response parameters; `env_weight` is the lever if it turns.
#   pol_ff/ct_ff    vs pol_mae/ct_mae: pol and ct are both "environment-dependent correction"
#   against the     and are separated only by their labels and by acting on disjoint pair sets.
#   MAEs            Same degeneracy shape as the intra-classical/bond leak, which the fit did
#                   NOT police on its own. Watch the split, not the MAE.
#   q_ct            charge actually crossing a fragment boundary (e). Zero means the compliance
#                   head closed every channel and `ct` is carried entirely by its correction.
#   env_norm        how much environment the model asks for. Anchoring makes g's gradient a
#                   difference between streams, so it may wake slowly; still pinned at 0 after
#                   ~30 epochs of stage 2 means the environment path is not earning its place.
#
# Stage 1 must hold its frozen-level numbers through stages 2 and 3: elst_mae, pauli_mae,
# disp_mae and the intra_* leaks are not allowed to regress while pol_mae and ct_mae come down.
# The one expected exception is elst at stage 2, where its correction moves from the
# environment-aware stream to the fragment-confined one and the difference becomes the
# polarization correction -- that makes cls_elec rigorously two-body, which is what the
# interaction between frozen monomer densities is.

run_name: water_staged
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd.xyz
  atomic_reference_states: data/atomic_reference_states.json
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]   # lambda=1 for chivec/Pauli dipoles, lambda=2 for alpha
  backend: e3nn
  density_channels: 8

unified:
  max_rank: 2                   # must match elec.max_rank
  # Range separation. Per element (see src/ff/range_priors.py), per channel, learnable.
  alpha_init: 40.0
  learn_r0: true
  environment_r0: false         # competes with the pair correction; leave off for the first fit
  pair_range_separation: true   # per-pair r0 on top of the element prior; see UnifiedConfig
  learn_alpha: true
  # Fragment-state slot: identically zero for a neutral singlet, so inert on this data.
  # Present so H5O2+ is an addition rather than a retrofit. Set 0 to drop it entirely.
  fragment_state_dim: 4
  # Environment-aware descriptor for the INTERACTION parameters: h_env = h_frag + g(h_full),
  # g zero-initialized so this starts from exactly the fragment-confined model and env_norm
  # measures how much environment the fit actually asks for. This is what lets C6 be quenched
  # by the surroundings -- effective many-body dispersion.
  #
  # Intra-fragment pairs and the response solve stay on h_frag regardless: `fragment_energy`
  # is an isolated-fragment label with no environment dependence to fit, so a 1-body term
  # built on h_env would be fitting a function that cannot match its target. The cost is a
  # second power spectrum per forward (one shared neighbor search) and the interaction
  # channels ceasing to be rigorously two-body -- which is the intended trade, not a
  # regression.
  environment_features: true
  env_hidden: 64
  env_depth: 2
  env_weight: 0.0
  # Shared correction trunk
  emb_dim: 16
  corr_hidden: 64
  corr_depth: 2
  corr_n_radial: 8
  corr_r_on: 4.0
  corr_r_off: 5.0               # must not exceed features.cutoff
  elst_energy_scale: 3.0e-3
  pauli_energy_scale: 3.0e-3
  disp_energy_scale: 1.0e-3
  bond_energy_scale: 0.2        # Hartree; water's two O-H bonds are ~-0.37 Ha
  bond_r_on: 2.5
  bond_r_off: 4.0
  # Classical reach. The largest sets the one shared pair list.
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0
  # Loss. Each term is 1.0 at an error of one energy_scale, so these are dimensionless.
  # The interaction channels are weighted up for the same reason as configs/
  # water_onebody_elec.yaml: at init the fragment energy is off by ~960 kJ/mol against
  # cls_elec's ~14, so equal weights let the 1-body term own the first several epochs.
  energy_scale: 3.8093e-4
  onebody_weight: 1.0
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  anchor_weight: 1.0
  anchor_batch_size: 64        # the anchor force term is a 2nd-order backward; see UnifiedConfig
  r0_weight: 0.05
  intra_classical_weight: 0.05  # keep the classical forms out of the bond channel's region
  r0_spread_weight: 0.0
  # Level settings shared by every stage; the stages below flip the two switches.
  ct_channel_cutoff: 5.0
  ct_channel_taper: 1.0
  ct_compliance_scale: 0.1
  cg_rtol: 1.0e-9
  cg_atol: 1.0e-12
  cg_maxiter: 100

# Reused verbatim by the unified model: the response solve and the two parameter heads.
elec:
  max_rank: 2
  environment_chi: true
  environment_eta: true
  eta_floor: 0.05
  learn_dipole: true
  learn_quadrupole: true
  learn_z: true
  environment_z: false
  learn_b: true
  environment_b: false
  s_init: 0.5
  emb_dim: 16
  hidden: 64
  depth: 2
  equiv_channels: 32
  # Frozen-monomer multipoles on the anchor. These pin q/mu/Theta themselves; the fragment
  # energies then pin the response energy that produced them.
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2

dispersion:
  b_prior: per_element          # a uniform 2.0 over-binds badly; see build_log_priors
  learn_c6: true
  environment_c6: true
  learn_b: true
  environment_b: false
  emb_dim: 16
  hidden: 64
  depth: 2

pauli:
  learn_q: true
  environment_q: true
  learn_b: true
  environment_b: false
  learn_dipole: true
  learn_quadrupole: true
  emb_dim: 16
  hidden: 64
  depth: 2
  equiv_channels: 32

onebody:
  # The unified model reads only force_weight/force_scale/energy_scale from this block, for
  # the isolated-monomer anchor where the QC gradient really is -dE_1body/dR.
  energy_scale: 3.8093e-4
  force_weight: 1.0
  force_scale: 1.0e-3

train:
  epochs: 150          # overridden per stage below
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 2

# Three stages, run in order from one command. Each inherits everything above and overrides
# only what changes; an unknown field here raises immediately rather than being ignored.
stages:
  - name: frozen
    train:
      epochs: 150
    unified:
      polarization: false
      charge_transfer: false

  - name: pol
    train:
      epochs: 100
    unified:
      polarization: true
      charge_transfer: false
      pol_weight: 30.0

  - name: ct
    train:
      epochs: 100
    unified:
      polarization: true
      charge_transfer: true
      pol_weight: 30.0
      ct_weight: 30.0
