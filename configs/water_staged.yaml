# The whole decomposition, fitted in one run.
#
#   python -m rsfff.train.train_unified configs/water_staged.yaml
#
# Two levels, one stage:
#
#   frozen      fragment_energy, eda_cls_elec, eda_mod_pauli, eda_disp. The response solve is
#               fragment-confined and reads `h_frag`; Pauli and dispersion parameters read the
#               environment-aware `h_env`, because a quenched C6 *is* their many-body content.
#
#   induction   eda_pol + eda_ct, as **one** label. Every response parameter -- chi, eta,
#               alpha and the charge-flux compliance alike -- reads `h_env`, and the
#               inter-fragment electrostatics moves inside the response functional so the
#               multipoles relax against each other. The fragment still supplies the *graph*
#               of allowed charge flux (its own intra-fragment channels); the environment
#               supplies the *parameters* on it. No charge crosses a fragment boundary.
#
# Why polarization and charge transfer are one term now. They were two levels separated only
# by their labels and by the atomic energy's feature stream -- `h_frag` at pol, `h_env` at ct.
# That swap is a route to the label needing no charge to move and no multipole to relax, and
# it is far cheaper to fit than actual charge flow. Measured on a trained checkpoint, `ct` was
# 99.99% correction and 100.0% descriptor swap, with 4.6e-5 e crossing a fragment boundary
# against a real ~0.01-0.03 e per hydrogen bond -- the compliance head had closed every
# inter-fragment channel while `ct_mae` read 0.40 kJ/mol. Same failure as the `ct_bond` readout
# before it (96.7% neural), through a different route. Explicit charge transfer returns when
# reactivity does, and it will need `ct_compliance_scale` again then.
#
# Only charges and dipoles respond. Permanent quadrupoles are kept and emitted directly;
# `elec.quadrupole_response` puts the quadrupole polarizability back.
#
# What to watch, in order of what will bite:
#
#   ind_ff      the coupled solve's own relaxation, kJ/mol. Negative by the variational
#   ind_corr    principle while `h_env == h_frag`; the guarantee lapses once `g` trains the
#   ind_swap    streams apart, which is why it is logged and not asserted. `ind_corr` is the
#               neural remainder -- if it swamps `ind_ff`, induction has become a network
#               wearing the label, which is exactly what happened to `ct`. `ind_swap` is the
#               part of `ind_corr` coming from the `h_frag -> h_env` swap alone.
#   cg_ind      CG iterations, 5-8 on a fresh model. A climbing count is the early warning
#               that the coupled functional is losing positive definiteness -- for an
#               induction model, that it is running away -- well before a NaN.
#   cg_fail     frames that did not converge or hit negative curvature. Must stay 0.
#   internal    the unlabeled split inside `fragment_energy`. Only their *sum* is fitted, so
#   e_atom      this is a flat direction: watch their spread over the last few epochs, not
#               their values. `train.lr_schedule` is what keeps it from diffusing.
#   env_norm    how much environment the model asks for. Anchoring makes g's gradient a
#               difference between streams, so it wakes slowly -- but it must wake. If it
#               reads exactly 0.0 rather than merely small, that is weight decay having
#               deleted a zero-initialized block (rsfff.mlip.heads.zero_init_readout), not
#               the model declining the environment.
#   alpha_mae   monomer polarizability error, max tensor component in e^2*Ang^2/Ha
#               (1 a0^3 = 0.28).

run_name: water_staged
device: auto
dtype: float64
checkpoint_root: checkpoints

data:
  path:
    - data/wb97mv_tzvpd/w2_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w3_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w4_wb97mv_tzvpd.xyz
    - data/wb97mv_tzvpd/w5_wb97mv_tzvpd.xyz
  reference_energies: data/atomic_references_wb97mv_tzvpd.json
  # The monomer anchor, with the def2-TZVPD molecular polarizability tensors folded in by
  # scripts/parse_polarizability.py (499 of 500 frames; one Q-Chem job did not finish).
  monomer_path: data/wb97mv_tzvpd/h2o_wb97mv_tzvpd_pol.xyz
  # wB97M-V/def2-TZVPD, matching the labels. The older file this replaced said b3lyp/def2-svpd
  # in its own header while every label here is wB97M-V/def2-TZVPD -- and these states are not
  # decoration: they seed the per-element chi_0/eta_0 of the SQE solve and, from
  # `free_alpha_weight` on, they pin the free-atom polarizability exactly.
  # See scripts/atomic_reference_states_wb97mv.py.
  atomic_reference_states: data/atomic_reference_states_wb97mv_tzvpd.json
  holdout_fraction: 0.1
  seed: 0

features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas: [0, 1, 2]   # lambda=1 for chivec/Pauli dipoles, lambda=2 for alpha
  backend: e3nn
  density_channels: 8

unified:
  max_rank: 2                   # must match elec.max_rank
  # Range separation. Per element (see src/ff/range_priors.py), per channel, learnable.
  alpha_init: 40.0
  learn_r0: true
  environment_r0: false         # competes with the pair correction; leave off for the first fit
  # Per-element r0 only. The per-pair deviation is read from the pair trunk, which is switched
  # off below -- and it was implicated in the dispersion leak that put -39 kJ/mol per fragment
  # of "intramolecular dispersion" between bonded atoms, because the shared trunk applied one
  # deviation to intra and inter pairs alike.
  pair_range_separation: false
  learn_alpha: true
  # Fragment-state slot: identically zero for a neutral singlet, so inert on this data.
  # Present so H5O2+ is an addition rather than a retrofit. Set 0 to drop it entirely.
  fragment_state_dim: 4
  # Environment-aware descriptor for the INTERACTION parameters: h_env = h_frag + g(h_full),
  # g zero-initialized so this starts from exactly the fragment-confined model and env_norm
  # measures how much environment the fit actually asks for. This is what lets C6 be quenched
  # by the surroundings -- effective many-body dispersion.
  #
  # Intra-fragment pairs and the response solve stay on h_frag regardless: `fragment_energy`
  # is an isolated-fragment label with no environment dependence to fit, so a 1-body term
  # built on h_env would be fitting a function that cannot match its target. The cost is a
  # second power spectrum per forward (one shared neighbor search) and the interaction
  # channels ceasing to be rigorously two-body -- which is the intended trade, not a
  # regression.
  environment_features: true
  env_hidden: 64
  env_depth: 2
  env_weight: 0.0
  # Shared correction trunk
  emb_dim: 16
  corr_hidden: 32
  corr_depth: 2
  corr_n_radial: 8
  corr_r_on: 4.0
  corr_r_off: 5.0               # must not exceed features.cutoff
  elst_energy_scale: 3.0e-3
  pauli_energy_scale: 3.0e-3
  disp_energy_scale: 1.0e-3
  bond_energy_scale: 0.2        # Hartree; water's two O-H bonds are ~-0.37 Ha
  bond_r_on: 2.5
  bond_r_off: 4.0
  # --- the atomic energy replaces the pair corrections ---------------------------------
  # The bond readout was carrying three jobs: the covalent bond energy, the unlabeled
  # one-body gauge inside `fragment_energy`, and (through the bond_pol/bond_ct telescoping)
  # `eda_pol` and `eda_ct`. Two of the three had no label, and the measured result was a
  # constant -1.686 kJ/mol per fragment in `fragment_energy` -- identical to three decimals
  # across w2..w5, so the frame-pooled plots drew it as a size-dependent offset -- alongside a
  # `ct` channel that was 96.7% neural.
  #
  # `atomic_energy` takes over the first job properly: one network, read at three electronic
  # states, so what separates the levels is the state and not a parameter. The pair head stays
  # built and loadable, its other readouts are simply not consumed.
  #
  # Per channel, so the two cases can be told apart. `bond` and `ct_bond` are the ones the
  # paragraph above is about: they sit where nothing labels them, degenerate with
  # `atomic_energy` and with `ct` respectively, and they stay off. `elst` is not in that
  # position -- it corrects a channel that has its own label (`eda_cls_elec`) and is the only
  # correction whose `h_env - h_frag` difference is routed to `pol`, so it corrects
  # polarization too. `pauli` and `disp` stay off for now: their channels are the two whose
  # classical forms already leaked into the bonded region once, and adding a neural readout
  # there before that is settled would re-open it with no label to catch it.
  #
  # Cost: turning `elst` on makes the electrostatic split live, which scores the inter pairs a
  # second time on `h_frag` (the frozen re-score whose difference becomes `pol`). Measured
  # per epoch: +15% at the frozen stage, +9% at ct.
  pair_corrections: []
  atomic_energy: true
  atomic_energy_hidden: 32
  atomic_energy_depth: 2
  atomic_energy_equiv_channels: 32
  atomic_energy_scale: 0.2      # sized against a covalent bond, like bond_energy_scale
  # A per-element energy offset, gated to vanish at the free atom so `E0` stays exact.
  #
  # This is the one direction the free-atom anchoring takes away: it subtracts `net(ref)`, so
  # the readout's final-layer bias cancels identically (its gradient is exactly zero), `E0` is
  # a frozen buffer, and a uniform `chi` shift is inert because `sum q = 0` per fragment.
  # Nothing could move the one-body constant without also reshaping the geometry dependence.
  #
  # Measured on the previous `full` checkpoint, that cost a **constant -5.23 kJ/mol per
  # fragment**, identical to 0.13 across the monomer anchor and w2..w5. It was 99.7% of the
  # one-body loss and 99.3% of the gradient that loss put into `atomic_energy.net` -- the MLP
  # that also has to describe the bond's shape dependence, which was already good to 0.13.
  # Fitting this parameter alone took the residual to 0.12 with every EDA channel bitwise
  # unchanged.
  #
  # Zero-initialized, so turning it on is bit-identical until it trains, and an older
  # checkpoint warm starts with this one tensor left at its initialization. Set 0 to disable.
  atomic_energy_offset_scale: 1.0e-2
  # Classical reach. The largest sets the one shared pair list.
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0
  # Loss. Each term is 1.0 at an error of one energy_scale, so these are dimensionless.
  # The interaction channels are weighted up for the same reason as configs/
  # water_onebody_elec.yaml: at init the fragment energy is off by ~960 kJ/mol against
  # cls_elec's ~14, so equal weights let the 1-body term own the first several epochs.
  energy_scale: 3.8093e-4
  onebody_weight: 30.0
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  # Induction: polarization and charge transfer as one term, fitted against eda_pol + eda_ct.
  # See UnifiedConfig.induction for why they were two and are now one -- the short version is
  # that `ct` was measured at 99.99% correction and 100.0% descriptor swap, with 4.6e-5 e
  # crossing a fragment boundary, while `ct_mae` read 0.40 kJ/mol and reported nothing wrong.
  induction: true
  induction_weight: 30.0
  # Raised from 1.0. With induction on at weight 30 and the frozen level *not* frozen, the
  # monomer anchor is the only thing pinning what an isolated water is, and at 32 anchor
  # frames a step against ~8600 cluster frames it was being outvoted.
  anchor_weight: 10.0
  # The monomer anchor is a fixed cost per *optimizer step*, independent of the cluster batch
  # size, and profiling put it at 58% of a step at batch 32. Two levers, both here: draw fewer
  # monomer frames, and apply the force term -- the fit's only second-order backward, 36% of a
  # step on its own -- every fifth step. See `train.batch_size` for the third.
  anchor_batch_size: 32        # the anchor force term is a 2nd-order backward; see UnifiedConfig
  anchor_force_every: 5
  # **Cluster forces, strided.** These are what make the decomposition a force field rather
  # than an energy model, so they are worth having -- but the cluster force is a
  # `create_graph=True` backward through the whole model *including the coupled solve*, and it
  # is the most expensive single thing this fit can be asked to do. Measured at batch 128 with
  # induction on: 31.8 s/epoch without it, 86.1 with it every step (2.7x), ~59 at every other
  # step (1.9x). Every other step is the trade taken here.
  #
  # Only meaningful once induction is on -- below that the decomposition is missing a channel
  # by construction, so `energy` is short ~20 kJ/mol per frame and its gradient would push that
  # deficit into whichever channel distorts cheapest. The pre-training stage leaves both off.
  #
  # Note the documented ~1e-4 relative bias in the force *gradient* at the induction level
  # (UnifiedConfig.force_weight): the forces themselves are exact, only their parameter
  # derivative is, because the coupled solve's adjoint is not double-differentiable.
  force_weight: 1.0
  force_scale: 1.0e-3          # Ha/Angstrom
  force_every: 2
  # **The cluster total, off, and measured rather than assumed.** Forces are the gradient of
  # the total, so supervising it alongside them looks natural -- but it hands the correction an
  # easy route, and the correction is what has to be kept honest here. Measured over the same
  # two epochs of the `full` stage, weight 10 against 0:
  #
  #     ind_ff   +0.42  ->  -10.53      (the solve stops doing the work entirely)
  #     ind_corr -34.5  ->  -23.5
  #     ind_swap -17.5  ->   -3.5       (82% of the correction -> 15%)
  #     ind_mae   2.90  ->    1.57
  #     e_tot_mae 2.98  ->    2.40      (worse even at the thing it supervises)
  #
  # `ind_ff` going *positive* is the tell: induction had stopped being a relaxation. The total
  # is one number per frame against five well-posed component targets, and it admits every
  # wrong split that happens to sum correctly -- at weight 10 against components at 30, it took
  # one. Turn it on only with a reason and watch that split when you do.
  total_energy_weight: 0.0
  # The exact free-atom limit of the on-site polarizability, from
  # data/atomic_reference_states_wb97mv_tzvpd.json (H 5.05, O 5.53 a0^3). A lone atom has an
  # all-zero density, so alpha_i collapses to one isotropic number per element and this pins
  # it rather than nudging it. It is what the Phase-1 monomer fit had and this one dropped --
  # and it matters because alpha_flow, built from B^T R, has no component perpendicular to a
  # planar molecule, so the on-site sector carries all of water's out-of-plane response alone.
  free_alpha_weight: 1.0
  # A one-sided barrier holding r0_pair at or below its element prior, not the unbounded
  # downward pull this used to be. That pull is what put -39 kJ/mol per fragment of
  # "intramolecular dispersion" between bonded atoms in the last run: it drove the *shared
  # trunk's* per-pair deviation to -0.42 on intra and inter O-H alike, so restricting the
  # penalty to inter pairs protected nothing. See AnchorTerms.penalties.
  r0_weight: 0.05
  intra_classical_weight: 0.05  # keep the classical forms out of the bond channel's region
  # Holds each per-atom r0 near its element prior, in log space. Nonzero now because the
  # barrier above is one-sided and so does not oppose a downward drift of the per-element
  # base: in the last run r0(H) and r0(O) on the dispersion channel effectively swapped
  # (1.75 -> 0.87, 0.89 -> 1.70) with nothing pushing back. Watch r0_elst/r0_pauli/r0_disp.
  r0_spread_weight: 1.0
  # Nothing to hold and nothing to hold it against: one stage decides both levels, so the
  # frozen level has no earlier value to be frozen at or to have its drift measured from.
  freeze_frozen_level: false
  internal_drift_weight: 0.0
  cg_rtol: 1.0e-9
  cg_atol: 1.0e-12
  cg_maxiter: 100

# Reused verbatim by the unified model: the response solve and the two parameter heads.
elec:
  max_rank: 2
  environment_chi: true
  environment_eta: true
  eta_floor: 0.05
  learn_dipole: true
  learn_quadrupole: true
  # **Only charges and dipoles move.** Each atom keeps a permanent quadrupole -- emitted
  # directly by the head below, so `cls_elec` and the fragment quadrupole labels are unchanged
  # -- but no field gradient moves it, and the coupled solve carries no quadrupole variable.
  # It is the smallest of the three response sectors and the one whose (C, chiquad) gauge is
  # least constrained by any label here. Turning it back on is this one flag.
  #
  # Only expressible under `direct_multipoles` below: in the drive form the moment *is*
  # -C*chiquad, so removing C removes the moment with it. FragmentResponse refuses that
  # combination rather than silently zeroing the quadrupoles.
  quadrupole_response: false
  # Inert while `quadrupole_response` is off: there is no quadrupole polarizability to be
  # anisotropic. Kept so switching the response back on restores the axial form it had.
  anisotropic_cquad: true
  # Output the permanent multipoles directly; alpha/cquad describe only the response to a
  # field. Same functional as the chivec form (mu0 = -alpha chivec) so the solve is unchanged,
  # but the permanent multipole stops being a product of two heads -- which is the entanglement
  # that let the polarizability be dismantled (9.904 -> 8.903 a0^3) while the dipole labels
  # looked fine -- and alpha -> 0 no longer forces a non-polar atom.
  #
  # It empties the on-site sectors out of `internal`: with the frozen state *at* the minimum
  # there is no -1/2 chi^T a chi to report, so the ~-400 kJ/mol per fragment it carried moves
  # into `atomic_energy`. Watch `d_internal` AND `d_e_atom` from here on; the first is near
  # zero by construction now and would never fire on its own.
  direct_multipoles: true
  learn_z: true
  environment_z: false
  learn_b: true
  environment_b: false
  s_init: 0.5
  emb_dim: 8
  hidden: 32
  depth: 2
  equiv_channels: 32
  # Frozen-monomer multipoles on the anchor. These pin q/mu/Theta themselves; the fragment
  # energies then pin the response energy that produced them.
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2
  polarizability_weight: 1.0
  polarizability_scale: 0.5

dispersion:
  b_prior: per_element
  learn_c6: true
  environment_c6: true
  learn_b: true
  environment_b: false
  emb_dim: 8
  hidden: 16
  depth: 2

pauli:
  learn_q: true
  environment_q: true
  learn_b: true
  environment_b: false
  learn_dipole: true
  learn_quadrupole: true
  emb_dim: 8
  hidden: 16
  depth: 2
  equiv_channels: 16

onebody:
  # The unified model reads only force_weight/force_scale/energy_scale from this block, for
  # the isolated-monomer anchor where the QC gradient really is -dE_1body/dR.
  energy_scale: 3.8093e-4
  force_weight: 1.0
  force_scale: 1.0e-3

train:
  epochs: 80
  init_from: ""
  lr_schedule: cosine
  lr_final_factor: 0.02
  batch_size: 128
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 5.0
  eval_every: 5

# Two stages: a cheap frozen pre-train, then the full joint fit.
#
# Each inherits everything above and overrides only what changes; an unknown field here raises
# immediately rather than being ignored. Stage 2 warm starts from stage 1's *best* checkpoint
# and writes to its own directory, so a stage can never overwrite what it started from.
#
# **Stage 2 is not a continuation of stage 1 with more terms bolted on -- it refits everything
# jointly**, `onebody_weight` included and with nothing frozen. That is the important part.
# The split of `fragment_energy` between `E_internal` and `E_atom` is unlabeled -- only their
# sum is fitted -- so it is a flat direction, and the old arrangement (fit the frozen level,
# pick its best epoch, freeze it, then fit the rest) handed the whole downstream fit one draw
# from a random walk: measured over a 40-epoch frozen stage, sd ~6 kJ/mol on each half at
# correlation -0.98, a labeled sum stable to 1.15, and a 32x spread on validation `ob_mae`
# (0.67 to 21.8). Induction is a second label on the response parameters -- the only one that
# says how the multipoles *move* rather than where they sit -- so keeping the one-body level
# free while it is fitted constrains `E_internal` from a direction `fragment_energy` cannot.
#
# What stage 1 is for, then, is **pre-training and nothing else**: it gets the frozen level
# into the right basin cheaply, so stage 2 does not spend its first several epochs falling
# from `ob_mae` ~1000 kJ/mol while the coupled solve runs on nonsense multipoles. It is ~20%
# cheaper per epoch (25.5 s against 31.8 at batch 128) and, more to the point, it needs no
# coupled solve, no force term and no total-energy term at all.
stages:
  - name: frozen
    train:
      epochs: 25
      # No annealing here: this stage is a warm start, not a converged answer, and the point of
      # the schedule is to land stage 2 on a converged point.
      lr_schedule: none
    unified:
      induction: false
      # The interaction channels and the one-body level, at their frozen definitions. No
      # coupled solve runs, so the cluster force and total-energy terms have an incomplete
      # decomposition to fit and are left off until stage 2.
      onebody_weight: 1.0
      force_weight: 0.0
      total_energy_weight: 0.0
      # Nothing above it yet, so nothing to outvote the anchor. This is the value the frozen
      # stage always used; stage 2 raises it because induction at weight 30 arrives there.
      anchor_weight: 1.0

  - name: full
    train:
      epochs: 80
    unified:
      # Everything from the `unified:` block above, which is already the full model: induction
      # on, cluster forces every other step, total energy on, and **nothing frozen**.
      induction: true
      freeze_frozen_level: false
      internal_drift_weight: 0.0
      onebody_weight: 1.0
