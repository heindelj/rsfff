# The film committee fit with HARD 1-2/1-3 EXCLUSIONS (film.nonbonded: exclusions): the
# strictly non-reactive film model. Identical to water_film_al.yaml -- film_committee_100k's
# architecture (~100k parameters: hidden 48, block_dim 32, head_hidden 24, ...), data section,
# loss weights and stages -- except for the nonbonded treatment:
#
#   * the 1-2 (O-H) and 1-3 (H-H) pairs of every water are removed from the pair list, so the
#     monomer energy is the bonded Morse + cosine angle alone and no intermolecular channel
#     ever turns on for those pairs (no kink in the one-body stretch scans);
#   * every other pair carries elst / Pauli / dispersion at full strength, switched only by
#     the taper at each channel's cutoff;
#   * no range-separation heads: alpha_init, r0_weight and r0_spread_weight are gone.
#
# Not warm-startable from film_committee_100k (that committee is range-separated and its
# bonded terms were fitted to cancel intramolecular classical pairs): fit it cold.
#
# By hand, on exactly the data film_committee_100k was fitted on -- the qchem_roundtrip
# training set in rsfff_data/train/data, which the data section below points at directly (no
# store, no export needed):
#
#   python train/train_committee.py --config train/water_film_excl_al.yaml \
#       --out committees/film_committee_100k_excl
#
# As the active-learning template (train.template: train/water_film_excl_al.yaml in the loop
# config, committee: the committee above for iteration 0), the train stage replaces
# data.path / data.force_path with its export from the cc_workers store; the anchors stay.
#
# Paths are relative to THIS file's directory unless absolute.
device: cuda
dtype: float64
data:
  path:
  - /global/cfs/cdirs/m3196/heindelj/rsfff_data/train/data/clusters/**/*.xyz
  reference_energies: /global/cfs/cdirs/m3196/heindelj/rsfff_data/train/data/atomic_references_wb97mv_tzvpd.json
  monomer_path: /global/cfs/cdirs/m3196/heindelj/rsfff_data/train/data/monomer/h2o_wb97mv_tzvpd_pol.xyz
  holdout_fraction: 0.1
  force_holdout_fraction: 0.1
  seed: 0
features:
  cutoff: 5.0
  n_max: 4
  l_max: 3
  selected_lambdas:
  - 0
  - 1
  - 2
  backend: e3nn
  density_channels: 8
film:
  nonbonded: exclusions     # hard 1-2/1-3 exclusions, no range heads
  exclude_through: 3        # 3: 1-2 and 1-3; 4 would add 1-4
  conditioning_mode: film
  cross_lambdas:
  - 0
  block_dim: 32
  hidden: 48
  depth: 2
  film_hidden: 16
  film_depth: 1
  gate_a0: 0.5
  max_rank: 2
  fragment_state_dim: 4
  emb_dim: 16
  head_hidden: 24
  head_depth: 1
  equiv_channels: 16
  bonded_hidden: 24
  bonded_depth: 1
  eta_init: 0.5
  eta_floor: 0.05
  s_init: 0.5
  disp_b_prior: per_element
  elst_cutoff: 12.0
  pauli_cutoff: 7.0
  disp_cutoff: 10.0
  taper_width: 1.0
  induction: true
  cg_rtol: 1.0e-09
  cg_atol: 1.0e-12
  cg_maxiter: 100
  energy_scale: 0.00038093
  elst_weight: 30.0
  pauli_weight: 30.0
  disp_weight: 30.0
  induction_weight: 30.0
  total_energy_weight: 5.0
  force_weight: 1.0
  force_scale: 0.001
  force_every: 2
  fragment_weight: 10.0
  fragment_batch_size: 128
  anchor_weight: 10.0
  anchor_batch_size: 32
  anchor_force_every: 5
  env_penalty_weight: 0.0
  bonded_variance_weight: 0.01
  force_stream_weight: 1.0
  force_stream_batch_size: 8
  force_stream_force_every: 1
  force_stream_energy_weight: 1.0
  force_stream_val_size: 64
elec:
  dipole_weight: 1.0
  dipole_scale: 0.05
  quadrupole_weight: 1.0
  quadrupole_scale: 0.2
  polarizability_weight: 1.0
  polarizability_scale: 0.5
onebody:
  energy_scale: 0.00038093
  force_weight: 1.0
  force_scale: 0.001
train:
  epochs: 80
  init_from: ''
  lr_schedule: cosine
  lr_final_factor: 0.02
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  eval_every: 5
  seed: 0
stages:
- name: isolated
  train:
    epochs: 15
    lr_schedule: none
  film:
    induction: false
    force_weight: 0.0
    fragment_weight: 30.0
- name: full
  train:
    epochs: 80
  film:
    induction: true
