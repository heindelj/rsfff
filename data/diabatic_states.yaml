# Diabatic fragment-state library.
#
# Each entry is one formal diabatic state of a chemical fragment: its element ordering, formal
# charge Q_a, spin multiplicity 2S_a+1, and -- critically -- its **channel graph** (the covalent
# bonds along which split charge may flow, docs/mixture_of_diabatic_embeddings.md §2.4.3).
#
# The bond graph is a property of the *diabatic state*, not of the geometry. A stretched O-H in a
# distorted H3O+ frame keeps its channel because the H3O+ diabat says the bond is there; a
# hydrogen that merely drifts to bonding distance acquires no channel unless a diabat places it
# in the fragment. Nothing in the code infers bonds from distances.
#
# `elements` is the canonical atom ordering; `bonds` index into it. Keys match the `config_type`
# header written by the data generators (lookup is case-insensitive).
#
# KEY SCHEME: `<formula>_q<charge>_m<multiplicity>`, e.g. `o2_q0_m3` (triplet O2) vs `o2_q0_m1`
# (singlet O2) vs `o2_q-1_m2` (superoxide) vs the atomic dianion `o_q-2_m1`. Encoding charge and
# spin in the key keeps otherwise-identical formulas (spin variants, atomic vs molecular anions)
# from colliding. This is an interim convention; a more robust identity scheme comes later.

states:
  # --- atomic reference states -------------------------------------------------------------
  # The states from which all molecular features are built (§2.1): each carries a formal charge
  # and spin, no bonds (a lone atom has no channel), and an isolated-atom QC anchor in
  # data/atomic_reference_states.json. A single atom has an all-zero SOAP density, so every
  # prediction head reduces to a function of its reference embedding alone -- these states are
  # what pin that limit. Multiplicities are the atomic ground terms; see
  # scripts/atomic_reference_states.py.
  h_q+1_m1: {charge: +1, multiplicity: 1, elements: [H], bonds: []}   # bare proton, E = 0
  h_q0_m2:  {charge:  0, multiplicity: 2, elements: [H], bonds: []}   # H, 1s^1 2S
  h_q-1_m1: {charge: -1, multiplicity: 1, elements: [H], bonds: []}   # H-, 1s^2 1S (unbound here)
  o_q+1_m4: {charge: +1, multiplicity: 4, elements: [O], bonds: []}   # O+, 2p^3 4S
  o_q0_m3:  {charge:  0, multiplicity: 3, elements: [O], bonds: []}   # O, 2p^4 3P
  o_q-1_m2: {charge: -1, multiplicity: 2, elements: [O], bonds: []}   # O-, 2p^5 2P
  o_q-2_m1: {charge: -2, multiplicity: 1, elements: [O], bonds: []}   # O2-, 2p^6 1S (unbound here)

  # --- diatomic fragment states ------------------------------------------------------------
  # Each carries the single O-H / H-H / O-O channel [[0,1]] and its competing dissociation
  # diabats. `dissociation` lists covers -- covalent (homolytic) and, where spin-allowed, ionic
  # (heterolytic) -- each partitioning the two atoms into anchored atomic references. The
  # formal-charge-Coulomb + fragment-self-energy proxy selects among them along the bond, and the
  # compliance switch closes the channel at large separation so the products reach their exact
  # reference states. Ionic covers are included only where the products can couple to the parent
  # spin (e.g. singlet H2 -> H+ + H-, but not triplet H2 or singlet O2).

  h2_q0_m1:                            # H2, X 1Sigma_g+ (bound)
    charge: 0
    multiplicity: 1
    elements: [H, H]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent: H + H
        order_parameter_bond: [0, 1]
        fragments:
          - {state: h_q0_m2, atoms: [0]}
          - {state: h_q0_m2, atoms: [1]}
      - name: heterolysis              # ionic: H+ + H-
        order_parameter_bond: [0, 1]
        fragments:
          - {state: h_q+1_m1, atoms: [0]}
          - {state: h_q-1_m1, atoms: [1]}

  h2_q0_m3:                            # H2, b 3Sigma_u+ (repulsive, non-bonding)
    charge: 0
    multiplicity: 3
    elements: [H, H]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent only: two triplet-coupled H (no triplet ionic)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: h_q0_m2, atoms: [0]}
          - {state: h_q0_m2, atoms: [1]}

  oh_q0_m2:                            # OH radical, X 2Pi
    charge: 0
    multiplicity: 2
    elements: [O, H]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent: O + H
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q0_m3, atoms: [0]}
          - {state: h_q0_m2, atoms: [1]}
      - name: heterolysis              # ionic: O- + H+
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q-1_m2, atoms: [0]}
          - {state: h_q+1_m1, atoms: [1]}

  oh_q-1_m1:                           # hydroxide OH-
    charge: -1
    multiplicity: 1
    elements: [O, H]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent: O- + H (charge stays on O -- the lower channel)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q-1_m2, atoms: [0]}
          - {state: h_q0_m2, atoms: [1]}
      - name: heterolysis              # ionic: O + H- (hydride leaves)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q0_m3, atoms: [0]}
          - {state: h_q-1_m1, atoms: [1]}

  o2_q0_m3:                            # O2, X 3Sigma_g- (ground state)
    charge: 0
    multiplicity: 3
    elements: [O, O]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent: O + O
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q0_m3, atoms: [0]}
          - {state: o_q0_m3, atoms: [1]}
      - name: heterolysis              # ionic: O+ + O- (2P (x) 4S couples to triplet)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q+1_m4, atoms: [0]}
          - {state: o_q-1_m2, atoms: [1]}

  o2_q0_m1:                            # singlet oxygen, a 1Delta_g / b 1Sigma_g+ (BS-UKS approx)
    charge: 0
    multiplicity: 1
    elements: [O, O]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # covalent only: O + O (O+/O- cannot couple to a singlet)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q0_m3, atoms: [0]}
          - {state: o_q0_m3, atoms: [1]}

  o2_q-1_m2:                           # superoxide O2-, X 2Pi_g
    charge: -1
    multiplicity: 2
    elements: [O, O]
    bonds: [[0, 1]]
    dissociation:
      - name: homolysis                # O- + O (the only low-lying anion channel)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: o_q-1_m2, atoms: [0]}
          - {state: o_q0_m3, atoms: [1]}

  # --- polyatomic fragment states ----------------------------------------------------------
  # Deferred phase (kept so the existing labels and tests resolve). Dissociation covers pull one
  # O-H apart; every product is an anchored atomic reference or a diatomic/monomer state above.
  h2o_q0_m1:
    charge: 0
    multiplicity: 1
    elements: [O, H, H]
    bonds: [[0, 1], [0, 2]]
    dissociation:
      - name: homolysis                # O-H1 homolysis: H1 leaves neutral (radical channel)
        order_parameter_bond: [0, 1]
        fragments:
          - {state: oh_q0_m2, atoms: [0, 2]}    # O0, H2 -> oh's canonical [O, H]
          - {state: h_q0_m2,  atoms: [1]}
      - name: proton_loss              # O-H1 heterolysis: H1 leaves as a proton
        order_parameter_bond: [0, 1]
        fragments:
          - {state: oh_q-1_m1, atoms: [0, 2]}   # O0, H2 -> oh-'s canonical [O, H]
          - {state: h_q+1_m1,  atoms: [1]}

  h3o_q+1_m1:
    charge: +1
    multiplicity: 1
    elements: [O, H, H, H]
    bonds: [[0, 1], [0, 2], [0, 3]]
    dissociation:
      - name: proton_loss              # O-H1 heterolysis: H1 leaves as a proton
        order_parameter_bond: [0, 1]
        fragments:
          - {state: h2o_q0_m1, atoms: [0, 2, 3]}   # O0, H2, H3 -> h2o's canonical [O, H, H]
          - {state: h_q+1_m1,  atoms: [1]}
